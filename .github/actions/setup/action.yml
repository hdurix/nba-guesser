name: 'Setup'
description: 'Setup environment with Java 17, Node 18'
runs:
  using: 'composite'
  steps:
    - name: 'Setup: Node.js'
      uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: 'Setup: Java 17'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: 'Setup: check tools'
      shell: bash
      run: |
        node -v
        npm -v
        java -version
